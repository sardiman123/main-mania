<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGER v5.8 12 BOLA</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0a1f;color:#fff;font-family:system-ui}
.top{padding:12px;background:#0006;display:flex;justify-content:space-between}
.coin{background:#ffcc00;color:#000;padding:6px 14px;border-radius:20px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:#221a4a;border-radius:22px;padding:16px;text-align:center;border:1px solid #3d3270}
.btn{width:100%;padding:14px;border:none;border-radius:25px;background:linear-gradient(90deg,#ff6a00,#ff9500);color:#fff;font-weight:900;margin-top:8px}
#gamePage{display:none;position:fixed;inset:0;background:#0f0a1f;z-index:9999;overflow:auto}
canvas{background:#1e8a2e;border-radius:16px;display:block;margin:8px auto;border:4px solid #000;touch-action:none}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:92vw;max-width:380px;aspect-ratio:1;margin:10px auto;border:2px solid #fff3}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px}
.power{height:12px;background:#111;border-radius:10px;overflow:hidden;margin:8px auto;max-width:360px}
.powerFill{height:100%;background:linear-gradient(90deg,#2f8,#fc0,#f33);width:0%}
</style>
</head>
<body>
<div id="home">
<div class="top"><b>🔥 MAGER v5.8 12 BOLA</b><div class="coin">💰 725</div></div>
<div style="background:#22ff88;margin:12px;border-radius:12px;padding:10px;text-align:center;color:#000;font-weight:900">✅ v5.8 - 12 BOLA + 6 LOBANG + TOMBOL HIDUP!</div>
<div class="grid">
<div class="card" style="border:2px solid #fff"><div style="font-size:48px">🎱</div><b>12 Ball Pool</b><br><small>6 Lobang + Nomor</small><button class="btn" onclick="openB()">MAIN NOW</button></div>
<div class="card"><div style="font-size:48px">♟️</div><b>Catur FIX</b><button class="btn" onclick="openC()">MAIN</button></div>
<div class="card"><div style="font-size:48px">🃏</div><b>Blackjack</b><button class="btn" onclick="openK()">MAIN</button></div>
<div class="card"><div style="font-size:48px">🎲</div><b>Bingo</b><button class="btn" onclick="openBi()">MAIN</button></div>
</div>
</div>
<div id="gamePage">
<div style="display:flex;justify-content:space-between;padding:12px;background:#1a1330"><button onclick="closeGame()" style="padding:8px 14px;border-radius:20px;border:none;background:#2a1f5a;color:#fff">← Menu</button><b id="gt">GAME</b><div class="coin">💰 725</div></div>
<div id="pB" style="display:none;text-align:center"><h3>🎱 12 Ball Pool - 6 Lobang</h3><canvas id="cv" width="360" height="580"></canvas><div class="power"><div id="pFill" class="powerFill"></div></div><div style="display:flex;gap:6px;justify-content:center;margin:6px"><span style="background:#1a1330;padding:6px 10px;border-radius:20px;font-size:11px">Masuk <b id="scoreB">0</b>/11</span><span style="background:#1a1330;padding:6px 10px;border-radius:20px;font-size:11px">Bola 8 <b id="eightStatus">Belum</b></span><span style="background:#1a1330;padding:6px 10px;border-radius:20px;font-size:11px">Tembak <b id="shots">0</b></span></div><button onclick="initB()" style="background:#2a1f5a;color:#fff;border:none;padding:8px 16px;border-radius:20px">🔄 Baru</button></div>
<div id="pC" style="display:none;text-align:center"><div id="board"></div><p id="cTurn" style="color:#ffcc00;margin:8px">Putih jalan</p><button onclick="initC()" style="background:#2a1f5a;color:#fff;border:none;padding:8px 14px;border-radius:20px">🔄 Baru</button></div>
<div id="pK" style="display:none;text-align:center;padding:20px"><h3>Blackjack</h3><p>Segera!</p></div>
<div id="pBi" style="display:none;text-align:center;padding:20px"><h3>Bingo</h3><p>Segera!</p></div>
</div>
<script>
function openB(){document.getElementById('home').style.display='none';document.getElementById('gamePage').style.display='block';document.getElementById('pB').style.display='block';document.getElementById('pC').style.display='none';document.getElementById('gt').innerText='12 Ball Pool';initB();}
function openC(){document.getElementById('home').style.display='none';document.getElementById('gamePage').style.display='block';document.getElementById('pC').style.display='block';document.getElementById('pB').style.display='none';initC();}
function openK(){document.getElementById('home').style.display='none';document.getElementById('gamePage').style.display='block';document.getElementById('pK').style.display='block';document.getElementById('pB').style.display='none';document.getElementById('pC').style.display='none';}
function openBi(){document.getElementById('home').style.display='none';document.getElementById('gamePage').style.display='block';document.getElementById('pBi').style.display='block';document.getElementById('pB').style.display='none';document.getElementById('pC').style.display='none';}
function closeGame(){document.getElementById('gamePage').style.display='none';document.getElementById('home').style.display='block';document.getElementById('pB').style.display='none';document.getElementById('pC').style.display='none';document.getElementById('pK').style.display='none';document.getElementById('pBi').style.display='none';}
var cue={x:180,y:480,vx:0,vy:0,moving:false},balls=[],pockets=[],drag=null,shots=0,scoreB=0;
var cv=document.getElementById('cv');var cx=cv.getContext('2d');
function initB(){balls=[];cue={x:180,y:480,vx:0,vy:0,moving:false};drag=null;shots=0;scoreB=0;document.getElementById('scoreB').innerText='0';document.getElementById('eightStatus').innerText='Belum';document.getElementById('shots').innerText='0';document.getElementById('pFill').style.width='0%';pockets=[{x:12,y:12,r:18},{x:180,y:6,r:15},{x:348,y:12,r:18},{x:12,y:568,r:18},{x:180,y:574,r:15},{x:348,y:568,r:18}];balls.push({x:180,y:90,c:'#ffdd00',vx:0,vy:0,alive:true,num:1},{x:166,y:114,c:'#0044ff',vx:0,vy:0,alive:true,num:2},{x:194,y:114,c:'#ff0000',vx:0,vy:0,alive:true,num:3},{x:152,y:138,c:'#880088',vx:0,vy:0,alive:true,num:4},{x:180,y:138,c:'#ff8800',vx:0,vy:0,alive:true,num:5},{x:208,y:138,c:'#008800',vx:0,vy:0,alive:true,num:6},{x:138,y:162,c:'#8b4513',vx:0,vy:0,alive:true,num:7},{x:166,y:162,c:'#000',vx:0,vy:0,alive:true,num:8},{x:194,y:162,c:'#ffdd00',vx:0,vy:0,alive:true,num:9,stripe:true},{x:124,y:186,c:'#0044ff',vx:0,vy:0,alive:true,num:10,stripe:true},{x:152,y:186,c:'#ff0000',vx:0,vy:0,alive:true,num:11,stripe:true},{x:180,y:186,c:'#880088',vx:0,vy:0,alive:true,num:12,stripe:true});}
function getPos(e){var r=cv.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)}}
cv.addEventListener('touchstart',function(e){e.preventDefault();var p=getPos(e);if(Math.hypot(p.x-cue.x,p.y-cue.y)<28){drag={sx:p.x,sy:p.y,x:p.x,y:p.y};}},{passive:false});
cv.addEventListener('touchmove',function(e){if(!drag)return;e.preventDefault();var p=getPos(e);drag.x=p.x;drag.y=p.y;var pow=Math.min(Math.hypot(drag.sx-drag.x,drag.sy-drag.y)/1.6,100);document.getElementById('pFill').style.width=pow+'%';},{passive:false});
cv.addEventListener('touchend',function(e){if(!drag)return;var p=getPos(e.changedTouches[0]);var dx=drag.sx-p.x,dy=drag.sy-p.y;var pow=Math.min(Math.hypot(dx,dy)/6,16);if(pow>1.2){var ang=Math.atan2(dy,dx);cue.vx=Math.cos(ang)*pow;cue.vy=Math.sin(ang)*pow;cue.moving=true;shots++;document.getElementById('shots').innerText=shots;}drag=null;document.getElementById('pFill').style.width='0%';},{passive:false});
function drawB(){cx.clearRect(0,0,360,580);cx.fillStyle='#0f3a0f';cx.fillRect(0,0,360,580);cx.fillStyle='#1e8a2e';cx.fillRect(4,4,352,572);cx.fillStyle='#2eaa3e';cx.fillRect(10,10,340,560);pockets.forEach(function(pk){cx.fillStyle='#000';cx.beginPath();cx.arc(pk.x,pk.y,pk.r,0,6.28);cx.fill();});balls.forEach(function(b){if(!b.alive)return;cx.fillStyle=b.c;cx.beginPath();cx.arc(b.x,b.y,12,0,6.28);cx.fill();if(b.stripe){cx.fillStyle='#fff';cx.fillRect(b.x-12,b.y-5,24,10);}cx.fillStyle='#fff';if(b.num==8){cx.font='bold 11px sans-serif';cx.textAlign='center';cx.fillText('8',b.x,b.y+4);}else{cx.beginPath();cx.arc(b.x,b.y,6,0,6.28);cx.fill();cx.fillStyle='#000';cx.font='bold 9px sans-serif';cx.textAlign='center';cx.fillText(b.num,b.x,b.y+3);}});cx.fillStyle='#fff';cx.beginPath();cx.arc(cue.x,cue.y,12,0,6.28);cx.fill();if(drag){var dx=drag.sx-drag.x,dy=drag.sy-drag.y,dist=Math.hypot(dx,dy);if(dist>10){var ang=Math.atan2(dy,dx);var sx=cue.x-Math.cos(ang)*(20+dist*0.45),sy=cue.y-Math.sin(ang)*(20+dist*0.45);cx.strokeStyle='#d9b88a';cx.lineWidth=7;cx.lineCap='round';cx.beginPath();cx.moveTo(sx,sy);cx.lineTo(sx-Math.cos(ang)*90,sy-Math.sin(ang)*90);cx.stroke();}}}
function updateB(){if(cue.moving){cue.x+=cue.vx;cue.y+=cue.vy;cue.vx*=0.983;cue.vy*=0.983;if(cue.x<24||cue.x>336){cue.x=cue.x<24?24:336;cue.vx*=-0.7;}if(cue.y<24||cue.y>556){cue.y=cue.y<24?24:556;cue.vy*=-0.7;}balls.forEach(function(b){if(!b.alive)return;var dx=b.x-cue.x,dy=b.y-cue.y,d=Math.hypot(dx,dy);if(d<24){var ang=Math.atan2(dy,dx);var f=Math.hypot(cue.vx,cue.vy)*0.88;b.vx=Math.cos(ang)*f;b.vy=Math.sin(ang)*f;}});if(Math.hypot(cue.vx,cue.vy)<0.18){cue.vx=0;cue.vy=0;cue.moving=false;}}balls.forEach(function(b){if(!b.alive)return;if(b.vx!=0||b.vy!=0){b.x+=b.vx;b.y+=b.vy;b.vx*=0.983;b.vy*=0.983;if(b.x<24||b.x>336){b.x=b.x<24?24:336;b.vx*=-0.7;}if(b.y<24||b.y>556){b.y=b.y<24?24:556;b.vy*=-0.7;}if(Math.hypot(b.vx,b.vy)<0.12){b.vx=0;b.vy=0;}}balls.forEach(function(o){if(!o.alive||o==b)return;var dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy);if(d<24&&d>0.5){var ang=Math.atan2(dy,dx);var ov=(24-d)/2;b.x-=Math.cos(ang)*ov;b.y-=Math.sin(ang)*ov;o.x+=Math.cos(ang)*ov;o.y+=Math.sin(ang)*ov;var nx=Math.cos(ang),ny=Math.sin(ang);var p=2*(b.vx*nx+b.vy*ny - o.vx*nx - o.vy*ny)/2;b.vx-=p*nx*0.82;b.vy-=p*ny*0.82;o.vx+=p*nx*0.82;o.vy+=p*ny*0.82;}});pockets.forEach(function(pk){if(Math.hypot(b.x-pk.x,b.y-pk.y)<pk.r-1){if(b.num==8){if(scoreB>=11){b.alive=false;document.getElementById('eightStatus').innerText='MENANG!';setTimeout(function(){alert('MENANG 12 BOLA!');},200);}else{b.x=180;b.y=210;b.vx=0;b.vy=0;alert('Bola 8 jangan dulu!');}}else{b.alive=false;scoreB++;document.getElementById('scoreB').innerText=scoreB;if(scoreB==11){document.getElementById('eightStatus').innerText='SIAP!';}}}});});pockets.forEach(function(pk){if(Math.hypot(cue.x-pk.x,cue.y-pk.y)<pk.r-1){cue.x=180;cue.y=480;cue.vx=0;cue.vy=0;cue.moving=false;}});}
(function loop(){requestAnimationFrame(loop);var pb=document.getElementById('pB');if(pb&&pb.style.display!='none'){updateB();drawB();}})();
var board=[],sel=null;
function initC(){board=['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];sel=null;drawC();}
function drawC(){var b=document.getElementById('board');if(!b)return;b.innerHTML='';var map={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔',P:'♙'};for(var i=0;i<64;i++){var d=document.createElement('div');d.className='sq';d.style.background=(Math.floor(i/8)+i%8)%2==0?'#f0d9b5':'#b58863';d.textContent=map[board[i]]||'';d.style.color=board[i]==board[i].toUpperCase()&&board[i]!=''?'#fff':'#000';(function(idx){d.onclick=function(){if(sel===null){sel=idx;drawC();}else{if(sel!=idx){board[idx]=board[sel];board[sel]='';}sel=null;drawC();}};})(i);if(sel==i)d.style.outline='3px solid #ff0';b.appendChild(d);}}
initC();
</script>
</body>
</html>
