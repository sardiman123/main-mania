<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Catur HTML</title>

    <!-- CSS Chessboard -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #222;
            color: #fff;
        }

        h1 {
            margin-bottom: 10px;
        }

        #board {
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .status-container {
            margin-top: 15px;
            font-size: 1.1rem;
            text-align: center;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Game Catur Sederhana</h1>
    <div id="board"></div>

    <div class="status-container">
        <p>Status: <span id="status">Putih melangkah</span></p>
    </div>

    <button id="resetBtn">Mulai Ulang</button>

    <!-- jQuery, Chess.js (Logika Aturan), & Chessboard.js (Tampilan) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function onDragStart (source, piece, position, orientation) {
            // Jangan izinkan geser jika game sudah selesai
            if (game.game_over()) return false;

            // Hanya izinkan menggeser bidak giliran pemain saat ini
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            // Cek apakah langkah valid
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // otomatis promosi jadi Menteri/Queen jika bidak sampai di ujung
            });

            // Jika langkah tidak sah, kembalikan bidak
            if (move === null) return 'snapback';

            updateStatus();
        }

        function onSnapEnd () {
            // Perbarui posisi papan sesuai status game
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';
            var moveColor = 'Putih';
            
            if (game.turn() === 'b') {
                moveColor = 'Hitam';
            }

            // Cek Skakmat / Remis / Skak
            if (game.in_checkmate()) {
                status = 'Game Selesai, ' + moveColor + ' kena Skakmat!';
            } else if (game.in_draw()) {
                status = 'Game Selesai, Hasil Remis (Draw)';
            } else {
                status = Giliran: ' + moveColor;
                if (game.in_check()) {
                    status += ' (Sedang SKAK!)';
                }
            }

            $status.html(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };

        board = Chessboard('board', config);

        $('#resetBtn').on('click', function () {
            game.reset();
            board.start();
            updateStatus();
        });

        updateStatus();
    </script>
</body>
</html>
