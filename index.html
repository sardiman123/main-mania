<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGER v5.4 NO CACHE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0a1f;color:#fff;font-family:system-ui}.top{padding:12px 16px;background:#0006;display:flex;justify-content:space-between}.coin{background:#ffcc00;color:#000;padding:6px 14px;border-radius:20px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}.card{background:#221a4a;border-radius:22px;padding:16px;text-align:center;border:1px solid #3d3270}.btn{width:100%;padding:14px;border:none;border-radius:25px;background:#ff6a00;color:#fff;font-weight:800;margin-top:8px;font-size:16px}#gamePage{display:none;position:fixed;inset:0;background:#0f0a1f;z-index:999;overflow:auto}canvas{background:#1a7a2a;border-radius:16px;display:block;margin:8px auto;border:4px solid #000;touch-action:none}#board{display:grid;grid-template-columns:repeat(8,1fr);width:92vw;max-width:380px;aspect-ratio:1;margin:10px auto;border-radius:12px;overflow:hidden;border:2px solid #fff3}.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px}</style></head><body>
<div id="home"><div class="top"><b>🔥 v5.4 NO CACHE FIX</b><div class="coin">💰 725</div></div><div style="background:#22ff88;margin:12px;border-radius:12px;padding:12px;text-align:center;color:#000;font-weight:900">✅ CACHE MATI! Tombol pasti hidup!</div><div class="grid"><div class="card"><div style="font-size:48px">🎱</div><b>8 Ball Pool</b><button class="btn" onclick="location.href='#billiard';document.getElementById('home').style.display='none';document.getElementById('gamePage').style.display='block';document.getElementById('pB').style.display='block';initB()">MAIN NOW</button></div><div class="card"><div style="font-size:48px">♟️</div><b>Catur FIX</b><button class="btn" onclick="document.getElementById('home').style.display='none';document.getElementById('gamePage').style.display='block';document.getElementById('pC').style.display='block';initC()">MAIN</button></div><div class="card"><div style="font-size:48px">🃏</div><b>Blackjack</b><button class="btn" onclick="alert('Blackjack OK')">MAIN</button></div><div class="card"><div style="font-size:48px">🎲</div><b>Bingo</b><button class="btn" onclick="alert('Bingo OK')">MAIN</button></div></div></div>
<div id="gamePage"><div style="display:flex;justify-content:space-between;padding:12px;background:#1a1330"><button onclick="document.getElementById('gamePage').style.display='none';document.getElementById('home').style.display='block';document.getElementById('pB').style.display='none';document.getElementById('pC').style.display='none'" style="padding:8px 14px;border-radius:20px;border:none;background:#2a1f5a;color:#fff">← Menu</button><b>GAME</b><div class="coin">💰 725</div></div>
<div id="pB" style="display:none;text-align:center"><h3>🎱 8 Pool WORKING!</h3><canvas id="cv" width="360" height="500"></canvas><br><button onclick="initB()" style="background:#2a1f5a;color:#fff;border:none;padding:10px 20px;border-radius:20px">🔄 Baru</button></div>
<div id="pC" style="display:none;text-align:center"><div id="board"></div><p id="cTurn" style="margin:8px;color:#ffcc00">Putih jalan</p><button onclick="initC()" style="background:#2a1f5a;color:#fff;border:none;padding:8px 14px;border-radius:20px">Baru</button></div>
</div>
<script>
var cv=document.getElementById('cv');var cx=cv.getContext('2d');var cue={x:180,y:400},balls=[];function initB(){balls=[];cue={x:180,y:400};balls.push({x:180,y:120,c:'#ff0',num:1},{x:166,y:144,c:'#00f',num:2},{x:194,y:144,c:'#f00',num:3},{x:152,y:168,c:'#808',num:4},{x:180,y:168,c:'#f80',num:5},{x:208,y:168,c:'#080',num:6},{x:138,y:192,c:'#840',num:7},{x:166,y:192,c:'#000',num:8});drawB();}function drawB(){cx.clearRect(0,0,360,500);cx.fillStyle='#1a7a2a';cx.fillRect(0,0,360,500);balls.forEach(function(b){cx.fillStyle=b.c;cx.beginPath();cx.arc(b.x,b.y,12,0,6.28);cx.fill();cx.fillStyle='#fff';cx.font='bold 10px sans-serif';cx.textAlign='center';cx.fillText(b.num,b.x,b.y+3);});cx.fillStyle='#fff';cx.beginPath();cx.arc(cue.x,cue.y,12,0,6.28);cx.fill();}initB();
var board=[];function initC(){board=['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','R','N','B','Q','K','B','N','R'];drawC();}function drawC(){var b=document.getElementById('board');if(!b)return;b.innerHTML='';var map={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔',P:'♙'};for(var i=0;i<64;i++){var d=document.createElement('div');d.className='sq';d.style.background=(Math.floor(i/8)+i%8)%2==0?'#f0d9b5':'#b58863';d.textContent=map[board[i]]||'';b.appendChild(d);}}initC();
</script></body></html>
