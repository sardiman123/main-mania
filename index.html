<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MAIN-MANIA v3 - Billiard Fix</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1033;color:white;font-family:sans-serif;overflow:hidden}
.header{text-align:center;padding:15px}.header h1{color:#ffde59}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px}
.card{background:#2a1f4d;border:2px solid #3d2e6e;border-radius:20px;padding:20px;text-align:center}
.card.active{border-color:#ffde59;box-shadow:0 0 15px #ffde59}
.card b{display:block;margin-top:10px}
.badge{background:#ffde59;color:#000;font-size:10px;padding:2px 6px;border-radius:10px}
#gameArea{display:none;position:fixed;inset:0;background:#0f0a1f;flex-direction:column}
canvas{background:#0a5c36;display:block;margin:auto;border:8px solid #5d4037;border-radius:10px;touch-action:none}
.topbar{display:flex;justify-content:space-between;padding:10px}
.btn{background:#ffde59;color:#000;border:none;padding:8px 15px;border-radius:20px;font-weight:bold}
.power{height:10px;background:#333;margin:10px 20px;border-radius:10px;overflow:hidden}
#powerFill{height:100%;width:0%;background:linear-gradient(90deg,green,yellow,red)}
</style></head><body>
<div id="menuPage">
<div class="header"><h1>🎮 MAIN-MANIA v3</h1><p>Billiard Pro FIX - Tap untuk main!</p></div>
<div class="menu">
<div class="card active" onclick="startBilliard()"><div style="font-size:50px">🎱</div><b>Billiard Pro <span class="badge">FIX!</span></b><small>6 lobang + tongkat</small></div>
<div class="card" onclick="alert('Catur segera!')"><div style="font-size:50px">♟️</div><b>Catur</b></div>
<div class="card" onclick="alert('Kartu 21 segera!')"><div style="font-size:50px">🃏</div><b>Kartu 21</b></div>
<div class="card" onclick="alert('Bingo segera!')"><div style="font-size:50px">🔢</div><b>Bingo</b></div>
</div>
<p style="text-align:center;opacity:.5;margin-top:20px">💰 Koin: 1000</p>
</div>

<div id="gameArea">
<div class="topbar"><button class="btn" onclick="backMenu()">← Menu</button><b>BILLIARD PRO</b><span>💰1000</span></div>
<canvas id="c" width="360" height="640"></canvas>
<div class="power"><div id="powerFill"></div></div>
<p style="text-align:center;font-size:12px;opacity:.7">Tarik bola putih ke belakang, lepas untuk tembak!</p>
</div>

<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),balls=[],pockets=[],cue={x:0,y:0,show:false,power:0,drag:false},whiteBall;
function backMenu(){document.getElementById('gameArea').style.display='none';document.getElementById('menuPage').style.display='block'}
function startBilliard(){
document.getElementById('menuPage').style.display='none';
document.getElementById('gameArea').style.display='flex';
initGame();
}
function initGame(){
balls=[];pockets=[{x:15,y:15},{x:180,y:10},{x:345,y:15},{x:15,y:625},{x:180,y:630},{x:345,y:625}];
whiteBall={x:180,y:500,vx:0,vy:0,r:10,color:'white'};
balls.push(whiteBall);
let colors=['#ff0000','#ffff00','#0000ff','#ff00ff','#ff8000','#00ffff','#800000'];
for(let i=0;i<7;i++){balls.push({x:100+i*25,y:120+ (i%2)*20,vx:0,vy:0,r:10,color:colors[i]})}
loop();
}
let startX=0,startY=0;
canvas.addEventListener('touchstart',e=>{let r=canvas.getBoundingClientRect();startX=e.touches[0].clientX-r.left;startY=e.touches[0].clientY-r.top;let d=Math.hypot(startX-whiteBall.x, startY-whiteBall.y);if(d<30){cue.drag=true}});
canvas.addEventListener('touchmove',e=>{if(!cue.drag)return;let r=canvas.getBoundingClientRect();let x=e.touches[0].clientX-r.left;let y=e.touches[0].clientY-r.top;let dx=whiteBall.x-x,dy=whiteBall.y-y;cue.power=Math.min(Math.hypot(dx,dy)/2,100);document.getElementById('powerFill').style.width=cue.power+'%';cue.x=x;cue.y=y;cue.show=true});
canvas.addEventListener('touchend',e=>{if(!cue.drag)return;cue.drag=false;cue.show=false;let dx=whiteBall.x-cue.x,dy=whiteBall.y-cue.y;whiteBall.vx=dx*0.15;whiteBall.vy=dy*0.15;document.getElementById('powerFill').style.width='0%';cue.power=0});
canvas.addEventListener('mousedown',e=>{let r=canvas.getBoundingClientRect();startX=e.clientX-r.left;startY=e.clientY-r.top;let d=Math.hypot(startX-whiteBall.x,startY-whiteBall.y);if(d<30)cue.drag=true});
canvas.addEventListener('mousemove',e=>{if(!cue.drag)return;let r=canvas.getBoundingClientRect();let x=e.clientX-r.left;let y=e.clientY-r.top;let dx=whiteBall.x-x,dy=whiteBall.y-y;cue.power=Math.min(Math.hypot(dx,dy)/2,100);document.getElementById('powerFill').style.width=cue.power+'%';cue.x=x;cue.y=y;cue.show=true});
canvas.addEventListener('mouseup',e=>{if(!cue.drag)return;cue.drag=false;cue.show=false;let dx=whiteBall.x-cue.x,dy=whiteBall.y-cue.y;whiteBall.vx=dx*0.15;whiteBall.vy=dy*0.15;document.getElementById('powerFill').style.width='0%';cue.power=0});

function loop(){
ctx.clearRect(0,0,360,640);
ctx.fillStyle='#0a5c36';ctx.fillRect(0,0,360,640);
// pockets
pockets.forEach(p=>{ctx.fillStyle='black';ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();});
// balls physics
balls.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vx*=0.985;b.vy*=0.985;if(Math.abs(b.vx)<0.05)b.vx=0;if(Math.abs(b.vy)<0.05)b.vy=0;
if(b.x-b.r<0||b.x+b.r>360)b.vx*=-1;if(b.y-b.r<0||b.y+b.r>640)b.vy*=-1;
b.x=Math.max(b.r,Math.min(360-b.r,b.x));b.y=Math.max(b.r,Math.min(640-b.r,b.y));
pockets.forEach(p=>{if(Math.hypot(b.x-p.x,b.y-p.y)<12 && b!=whiteBall){b.x=-100}});});
if(Math.hypot(whiteBall.x-pockets[0].x,whiteBall.y-pockets[0].y)<12||Math.hypot(whiteBall.x-pockets[3].x,whiteBall.y-pockets[3].y)<12){whiteBall.x=180;whiteBall.y=500;whiteBall.vx=0;whiteBall.vy=0;}
balls.forEach(b=>{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.stroke();});
// cue
if(cue.show){ctx.strokeStyle='#d2a679';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(whiteBall.x,whiteBall.y);ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.arc(whiteBall.x,whiteBall.y,3,0,Math.PI*2);ctx.fill();}
requestAnimationFrame(loop);
}
</script></body></html>
