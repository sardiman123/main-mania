<script>
let soundOn=true; let audioCtx;
function playSound(type){
 if(!soundOn) return;
 try{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
  if(type=='move'){o.frequency.value=400;g.gain.value=0.3;o.start();o.stop(audioCtx.currentTime+0.1);}
  if(type=='check'){o.frequency.value=800;g.gain.value=0.5;o.start();o.stop(audioCtx.currentTime+0.3); setTimeout(()=>{let o2=audioCtx.createOscillator();let g2=audioCtx.createGain();o2.connect(g2);g2.connect(audioCtx.destination);o2.frequency.value=600;g2.gain.value=0.5;o2.start();o2.stop(audioCtx.currentTime+0.3);},150);}
  if(type=='castle'){o.frequency.value=300;g.gain.value=0.4;o.start();o.stop(audioCtx.currentTime+0.15); setTimeout(()=>{let o2=audioCtx.createOscillator();let g2=audioCtx.createGain();o2.connect(g2);g2.connect(audioCtx.destination);o2.frequency.value=500;g2.gain.value=0.4;o2.start();o2.stop(audioCtx.currentTime+0.2);},100);}
  if(type=='mate'){o.frequency.value=200;g.gain.value=0.6;o.start();o.stop(audioCtx.currentTime+0.8); o.type='sawtooth';}
 }catch(e){}
}
function toggleSound(){soundOn=!soundOn; document.getElementById('sndBtn').innerText=soundOn?'🔊':'🔇';}

// POOL TETAP
let cv,cx,cue,balls,pockets,shots,score,drag=false,sx,sy;
function playPool(){document.getElementById('home').style.display='none';document.getElementById('gamePage').style.display='block';document.getElementById('gTitle').innerText='12 Ball Pool';document.getElementById('poolWrap').style.display='block';document.getElementById('chessWrap').style.display='none';setTimeout(init,100);}
function closeG(){document.getElementById('gamePage').style.display='none';document.getElementById('home').style.display='block';}
function init(){cv=document.getElementById('cv');cx=cv.getContext('2d');cue={x:175,y:450,vx:0,vy:0,mov:false};balls=[];shots=0;score=0;document.getElementById('sh').innerText='0';document.getElementById('sc').innerText='0';pockets=[{x:10,y:10},{x:175,y:5},{x:340,y:10},{x:10,y:570},{x:175,y:575},{x:340,y:570}];for(let i=1;i<=12;i++){let a=Math.random()*6.28,r=40+Math.random()*80;balls.push({n:i,x:175+Math.cos(a)*r,y:180+Math.sin(a)*r,vx:0,vy:0,in:false});}
cv.ontouchstart=cv.onmousedown=function(e){e.preventDefault();let p=getPos(e);if(Math.hypot(p.x-cue.x,p.y-cue.y)<30){drag=true;sx=p.x;sy=p.y;}}
cv.ontouchmove=cv.onmousemove=function(e){if(!drag)return;e.preventDefault();let p=getPos(e);sx=p.x;sy=p.y;}
cv.ontouchend=cv.onmouseup=function(e){if(!drag)return;e.preventDefault();let pos=getPos(e.changedTouches?e.changedTouches[0]:e);if(!pos)pos={x:sx,y:sy};let dx=cue.x-pos.x,dy=cue.y-pos.y;if(Math.hypot(dx,dy)>15){cue.vx=dx*0.18;cue.vy=dy*0.18;cue.mov=true;shots++;document.getElementById('sh').innerText=shots;}drag=false;}
requestAnimationFrame(loop);}
function getPos(e){if(!e.clientX&&e.touches)e=e.touches[0];let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
function loop(){if(cue.mov){cue.x+=cue.vx;cue.y+=cue.vy;cue.vx*=0.985;cue.vy*=0.985;if(Math.hypot(cue.vx,cue.vy)<0.2){cue.vx=0;cue.vy=0;cue.mov=false;}}if(cue.x<15||cue.x>335){cue.vx*=-1;cue.x=Math.max(15,Math.min(335,cue.x))}if(cue.y<15||cue.y>565){cue.vy*=-1;cue.y=Math.max(15,Math.min(565,cue.y))}balls.forEach(b=>{if(b.in)return;b.x+=b.vx;b.y+=b.vy;b.vx*=0.984;b.vy*=0.984;if(Math.abs(b.vx)<0.05)b.vx=0;if(Math.abs(b.vy)<0.05)b.vy=0;if(b.x<15||b.x>335){b.vx*=-1;b.x=Math.max(15,Math.min(335,b.x))}if(b.y<15||b.y>565){b.vy*=-1;b.y=Math.max(15,Math.min(565,b.y))}let d=Math.hypot(b.x-cue.x,b.y-cue.y);if(d<26&&cue.mov){let ang=Math.atan2(b.y-cue.y,b.x-cue.x);let sp=Math.hypot(cue.vx,cue.vy);b.vx=Math.cos(ang)*sp*1.1;b.vy=Math.sin(ang)*sp*1.1;cue.vx*=0.2;cue.vy*=0.2;}pockets.forEach(p=>{if(Math.hypot(b.x-p.x,b.y-p.y)<22){b.in=true;score++;document.getElementById('sc').innerText=score;if(score>=12){alert('MENANG!');init();}}});});cx.clearRect(0,0,350,580);cx.fillStyle="#16a34a";cx.fillRect(0,0,350,580);cx.fillStyle="#000";pockets.forEach(p=>{cx.beginPath();cx.arc(p.x,p.y,18,0,6.28);cx.fill();});balls.forEach(b=>{if(b.in)return;cx.beginPath();cx.arc(b.x,b.y,13,0,6.28);cx.fillStyle=b.n==8?"#111":b.n%2==0?"#f00":"#ff0";cx.fill();cx.fillStyle=b.n==8?"#fff":"#000";cx.font="bold 11px Arial";cx.textAlign="center";cx.fillText(b.n,b.x,b.y+4);});cx.beginPath();cx.arc(cue.x,cue.y,13,0,6.28);cx.fillStyle="#fff";cx.fill();cx.strokeStyle="#000";cx.lineWidth=1;cx.stroke();if(drag){cx.beginPath();cx.moveTo(cue.x,cue.y);cx.lineTo(sx,sy);cx.strokeStyle="#ff0";cx.lineWidth=3;cx.stroke();}requestAnimationFrame(loop);}

const pieceSym={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'};

function initChess(){board=[['r','n','b','q','k','b','n','r'],['p','p','p
