<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAIN-MANIA v5</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1033;color:#fff;font-family:sans-serif}
h1{text-align:center;color:#ffde59;padding:15px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#2a1f4d;border:2px solid #3d2e6e;border-radius:20px;padding:20px;text-align:center}
#game{display:none;position:fixed;inset:0;background:#0f0a1f;flex-direction:column;overflow:auto}
.top{display:flex;justify-content:space-between;padding:10px}
.btn{background:#ffde59;color:#000;border:0;padding:8px 14px;border-radius:20px;font-weight:bold}
canvas{background:#0a5c36;display:block;margin:auto;border:8px solid #5d4037;border-radius:12px}
.chess{width:360px;height:360px;display:grid;grid-template-columns:repeat(8,1fr);margin:10px auto;border:4px solid #5d4037}
.sq{display:flex;align-items:center;justify-content:center;font-size:24px}
.w{background:#f0d9b5;color:#000}.b{background:#b58863;color:#000}
.center{text-align:center;padding:20px}.bigBtn{background:#ffde59;color:#000;border:0;padding:12px 25px;border-radius:25px;font-weight:bold;margin:5px}
.card21{width:55px;height:80px;background:#fff;color:#000;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;margin:4px;font-weight:bold}
.bar{height:10px;background:#222;margin:8px 20px;border-radius:10px;overflow:hidden}#fill{height:100%;width:0%;background:yellow}
</style></head><body>
<div id="menu"><h1>🎮 MAIN-MANIA v5</h1><p style="text-align:center">Semua Game Jalan!</p>
<div class="menu">
<div class="card" onclick="openG('billiard')"><div style="font-size:40px">🎱</div><b>Billiard Pro</b><br><small>Bisa Tabrakan</small></div>
<div class="card" onclick="openG('catur')"><div style="font-size:40px">♟️</div><b>Catur 2P</b></div>
<div class="card" onclick="openG('kartu')"><div style="font-size:40px">🃏</div><b>Kartu 21</b></div>
<div class="card" onclick="openG('bingo')"><div style="font-size:40px">🔢</div><b>Bingo</b></div>
</div></div>
<div id="game"><div class="top"><button class="btn" onclick="location.reload()">← Menu</button><b id="gt">GAME</b><span>💰1000</span></div>
<div id="dBilliard"><canvas id="c" width="360" height="600"></canvas><div class="bar"><div id="fill"></div></div><p style="text-align:center;font-size:11px">Tahan bola putih, tarik, lepas!</p></div>
<div id="dCatur" style="display:none"><div id="board" class="chess"></div><p id="turn" style="text-align:center">Giliran Putih</p><div class="center"><button class="bigBtn" onclick="initC()">Reset</button></div></div>
<div id="dKartu" style="display:none" class="center"><h3>Blackjack 21</h3><div>Bandar: <span id="d"></span> <b id="ds"></b></div><div>Kamu: <span id="p"></span> <b id="ps"></b></div><br><button class="bigBtn" onclick="hit()">Ambil</button><button class="bigBtn" onclick="stand()">Stop</button><button class="bigBtn" onclick="initK()">Baru</button><p id="msg"></p></div>
<div id="dBingo" style="display:none" class="center"><h1 id="bn" style="font-size:80px">--</h1><p id="bl" style="font-size:12px"></p><button class="bigBtn" onclick="nextB()">Putar!</button><button class="bigBtn" onclick="initB()">Reset</button></div>
</div>
<script>
function openG(g){menu.style.display='none';game.style.display='flex';dBilliard.style.display=g=='billiard'?'block':'none';dCatur.style.display=g=='catur'?'block':'none';dKartu.style.display=g=='kartu'?'block':'none';dBingo.style.display=g=='bingo'?'block':'none';gt.innerText=g;if(g=='billiard')initB();if(g=='catur')initC();if(g=='kartu')initK();if(g=='bingo')initBingo
