<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MAGER v6.0 Rokade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
body{background:#0f0a1f;color:#fff;font-family:system-ui}
.top{padding:12px;background:#0008;display:flex;justify-content:space-between;align-items:center}
.coin{background:#ffcc00;color:#000;padding:6px 14px;border-radius:20px;font-weight:900}
.bonus{background:#00f2ff;color:#000;margin:12px;border-radius:12px;padding:12px;text-align:center;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#221a4a;border-radius:20px;padding:16px;text-align:center;border:1px solid #ffffff20}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#ff6a00,#ff2a6d);color:#fff;font-weight:900;margin-top:10px;font-size:16px}
#gamePage{display:none;position:fixed;inset:0;background:#0f0a1f;z-index:9999;overflow:auto}
#gameHeader{display:flex;justify-content:space-between;padding:12px;background:#1a1330;align-items:center}
canvas{background:#0e7a3a;border:3px solid #fff;display:block;margin:10px auto;border-radius:10px}
#chessBoard{display:grid;grid-template-columns:repeat(8,1fr);width:352px;height:352px;margin:10px auto;border:3px solid #fff;border-radius:8px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;position:relative}
.light{background:#f0d9b5;color:#000}.dark{background:#b58863;color:#000}
.sel{background:#f6f669!important;box-shadow:inset 0 0 0 4px #ff0}
.hint::after{content:'';width:16px;height:16px;background:#0008;border-radius:50%;position:absolute}
</style></head><body>
<div id="home">
<div class="top"><b>🎱 MAGER v6.0</b><div class="coin">💰 725</div></div>

<div class="grid">
<div class="card"><div style="font-size:50px">🎱</div><b>12 Ball Pool</b><br>6 Lobang - TETAP ADA!<button class="btn" onclick="playPool()">MAIN</button></div>
<div class="card"><div style="font-size:50px">♟️</div><b>Catur Rokade</b><br>Ukir Raja-Benteng<button class="btn" onclick="playChess()">MAIN</button></div>
<div class="card"><div style="font-size:50px">🃏</div><b>Blackjack</b><button class="btn" onclick="alert('Segera!')">MAIN</button></div>
