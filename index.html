let cv,cx,cue,balls,pockets,shots,score,drag,sx,sy;function playPool(){document.getElementById('home').style.display='none';document.getElementById('gamePage').style.display='block';document.getElementById('gTitle').innerText='12 Ball Pool';document.getElementById('poolWrap').style.display='block';document.getElementById('chessWrap').style.display='none';setTimeout(init,100);}function closeG(){document.getElementById('gamePage').style.display='none';document.getElementById('home').style.display='block';}function init(){cv=document.getElementById('cv');cx=cv.getContext('2d');cue={x:175,y:450,vx:0,vy:0,mov:false};balls=[];shots=0;score=0;document.getElementById('sh').innerText='0';document.getElementById('sc').innerText='0';pockets=[{x:10,y:10},{x:175,y:5},{x:340,y:10},{x:10,y:570},{x:175,y:575},{x:340,y:570}];for(let i=1;i<=12;i++){let a=Math.random()*6.28,r=40+Math.random()*80;balls.push({n:i,x:175+Math.cos(a)*r,y:180+Math.sin(a)*r,vx:0,vy:0,in:false});}cv.ontouchstart=cv.onmousedown=function(e){e.preventDefault();let p=getPos(e);if(Math.hypot(p.x-cue.x,p.y-cue.y)<30){drag=true;sx=p.x;sy=p.y;}};cv.ontouchmove=cv.onmousemove=function(e){if(!drag)return;e.preventDefault();let p=getPos(e);sx=p.x;sy=p.y;};cv.ontouchend=cv.onmouseup=function(e){if(!drag)return;let pos=getPos(e.changedTouches?e.changedTouches[0]:e);if(!pos)pos={x:sx,y:sy};let dx=cue.x-pos.x,dy=cue.y-pos.y;if(Math.hypot(dx,dy)>15){cue.vx=dx*0.18;cue.vy=dy*0.18;cue.mov=true;shots++;document.getElementById('sh').innerText=shots;}drag=false;};requestAnimationFrame(loop);}function getPos(e){if(!e.clientX&&e.touches)e=e.touches[0];let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}function loop(){if(cue.mov){cue.x+=cue.vx;cue.y+=cue.vy;cue.vx*=0.985;cue.vy*=0.985;if(Math.hypot(cue.vx,cue.vy)<0.2){cue.vx=0;cue.vy=0;cue.mov=false;}}if(cue.x<15||cue.x>335){cue.vx*=-1;cue.x=Math.max(15,Math.min(335,cue.x))}if(cue.y<15||cue.y>565){cue.vy*=-1;cue.y=M
